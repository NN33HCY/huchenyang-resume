  --glow-soft: 0 0 40px rgba(45, 212, 191, 0.08);
}

body {

  background-color: var(--banma-background);

}

<body style="margin:0; min-height:100vh; background:var(--banma-background); color:var(--banma-foreground); font-family:var(--banma-font-sans); display:flex; flex-direction:column; align-items:center; padding:64px 20px;">
  <style>
    .edu-container { width:100%; max-width:900px; }
    .edu-header { font-size:2.5rem; font-weight:700; margin-bottom:40px; text-align:center; letter-spacing:-0.02em; }
    .edu-header span { color:var(--banma-primary); }
    .timeline { position:relative; display:flex; flex-direction:column; gap:28px; padding-left:28px; border-left:2px solid var(--banma-border); }
    .timeline::before { content:""; position:absolute; left:-1px; top:0; bottom:0; width:2px; background:linear-gradient(180deg, var(--banma-primary), transparent); opacity:.6; }
    .edu-card { position:relative; background:var(--banma-card); border:1px solid var(--banma-border); border-radius:var(--banma-radius-lg); padding:28px; box-shadow:var(--glow-soft); }
    .edu-card::before { content:""; position:absolute; left:-35px; top:34px; width:12px; height:12px; border-radius:50%; background:var(--banma-primary); box-shadow:0 0 14px var(--banma-primary); }
    .edu-meta { display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    .edu-date { color:var(--banma-primary); font-weight:600; font-size:.95rem; }
    .edu-school { font-size:1.25rem; font-weight:600; }
    .edu-major { color:var(--banma-muted-foreground); font-size:1rem; }
    .edu-tags { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
    .tag { background:var(--banma-accent); color:var(--banma-accent-foreground); padding:5px 12px; border-radius:var(--banma-radius-md); font-size:.82rem; font-weight:500; box-shadow:0 0 14px rgba(45,212,191,.18); }
    .edu-desc { color:var(--banma-muted-foreground); line-height:1.7; font-size:.98rem; }
    .edu-icon { color:var(--banma-primary); width:22px; height:22px; }
    .nav { display:flex; justify-content:space-between; align-items:center; width:100%; max-width:900px; margin-top:48px; }
    .nav a { display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:var(--banma-radius-md); background:var(--banma-secondary); color:var(--banma-secondary-foreground); text-decoration:none; border:1px solid var(--banma-border); transition:all .2s ease; }
    .nav a:hover { border-color:var(--banma-primary); color:var(--banma-primary); box-shadow:var(--glow-primary); }
  </style>

  <main class="edu-container">
    <h1 class="edu-header">教育<span>背景</span></h1>

    <div class="timeline">
      <article class="edu-card">
        <div class="edu-meta">
          <i data-lucide="graduation-cap" class="edu-icon"></i>
          <span class="edu-date">2017.09 – 2020.12</span>
          <span class="edu-school">上海大学</span>
          <span class="edu-major">· 金融（本科）</span>
        </div>
        <div class="edu-tags">
          <span class="tag">经济学</span>
          <span class="tag">财务管理</span>
          <span class="tag">会计</span>
          <span class="tag">统计学</span>
          <span class="tag">概率论</span>
          <span class="tag">博弈论</span>
          <span class="tag">运筹学</span>
          <span class="tag">计量经济学</span>
          <span class="tag">R语言</span>
        </div>
        <p class="edu-desc">经济学与金融学训练培养了成本收益分析、数据统计与量化决策能力；博弈论与运筹学为机制设计和系统平衡提供了理论工具。</p>
      </article>

      <article class="edu-card">
        <div class="edu-meta">
          <i data-lucide="shield" class="edu-icon"></i>
          <span class="edu-date">2015.09 – 2017.09</span>
          <span class="edu-school">庐江县中队</span>
          <span class="edu-major">· 应征入伍</span>
        </div>
        <p class="edu-desc">两年军旅经历锻炼了执行力、抗压能力与团队协作意识，能够在高压环境下推进目标。</p>
      </article>

      <article class="edu-card">
        <div class="edu-meta">
          <i data-lucide="package" class="edu-icon"></i>
          <span class="edu-date">2013.09 – 2015.07</span>
          <span class="edu-school">上海大学</span>
          <span class="edu-major">· 物流管理</span>
        </div>
        <p class="edu-desc">系统学习供应链流程优化与运营管理，建立了对复杂系统的全局视角。</p>
      </article>
    </div>
  </main>
