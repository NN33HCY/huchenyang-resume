<body class="min-h-screen flex flex-col bg-background text-foreground">
  <header class="w-full max-w-6xl mx-auto px-8 pt-16 pb-8">

          <button id="copy-phone" type="button" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-primary text-primary-foreground font-medium hover:bg-primary/90 transition-colors" data-copy="16601891105" data-dom-id="copy-phone">
            <i data-lucide="copy" class="w-4 h-4"></i>
            <span>复制</span>
          </button>
        </div>
        <div>
          <p class="text-sm text-muted-foreground mb-1">电话</p>
          <p class="text-2xl md:text-3xl font-semibold text-foreground font-mono tracking-wide">16601891105</p>
        </div>
      </div>

      <!-- Email -->
      <div class="glow-card rounded-2xl bg-card p-8 flex flex-col justify-between min-h-[220px]">
        <div class="flex items-start justify-between mb-6">
          <div class="w-12 h-12 rounded-xl bg-accent/20 flex items-center justify-center text-primary">
            <i data-lucide="mail" class="w-6 h-6"></i>
          </div>

            <button id="copy-email" type="button" class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-primary text-primary-foreground font-medium hover:bg-primary/90 transition-colors" data-copy="616855934@qq.com" data-dom-id="copy-email">
              <i data-lucide="copy" class="w-4 h-4"></i>
              <span>复制</span>
            </button>
            <a href="mailto:616855934@qq.com" class="inline-flex items-center justify-center w-10 h-10 rounded-lg border border-border text-muted-foreground hover:text-primary hover:border-primary/40 transition-colors" aria-label="发送邮件">
              <i data-lucide="send" class="w-4 h-4"></i>
            </a>
          </div>
        </div>
        <div>
          <p class="text-sm text-muted-foreground mb-1">邮箱</p>
          <p class="text-2xl md:text-3xl font-semibold text-foreground font-mono tracking-wide">616855934@qq.com</p>
        </div>

      <!-- Location -->
      <div class="glow-card rounded-2xl bg-card p-8 flex flex-col justify-between min-h-[220px]">

          </div>
        </div>
        <div>
          <p class="text-sm text-muted-foreground mb-1">意向岗位</p>

  <div id="toast" class="toast inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-card border border-border text-foreground shadow-lg" role="status" aria-live="polite">
    <i data-lucide="check-circle-2" class="w-5 h-5 text-primary"></i>
    <span id="toast-message">已复制到剪贴板</span>
  </div>

  <script>
    (function () {
      lucide.createIcons();

      var toast = document.getElementById('toast');
      var toastMessage = document.getElementById('toast-message');
      var toastTimer = null;

      function showToast(message) {
        toastMessage.textContent = message;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 2000);
      }

      function copyText(text, label) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            showToast(label + '已复制到剪贴板');
          }).catch(function () {
            fallbackCopy(text, label);
          });
        } else {
          fallbackCopy(text, label);
        }
      }

      function fallbackCopy(text, label) {
        var textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast(label + '已复制到剪贴板');
        } catch (err) {
          showToast('复制失败，请手动复制');
        }
        document.body.removeChild(textarea);
      }

      var copyPhone = document.getElementById('copy-phone');
      var copyEmail = document.getElementById('copy-email');

      if (copyPhone) {
        copyPhone.addEventListener('click', function () {
          copyText(copyPhone.getAttribute('data-copy'), '电话');
        });
      }

      if (copyEmail) {
        copyEmail.addEventListener('click', function () {
          copyText(copyEmail.getAttribute('data-copy'), '邮箱');
        });
      }
    })();
  </script>
